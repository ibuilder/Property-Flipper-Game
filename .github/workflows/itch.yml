name: Publish to itch.io

# Runs after a release is tagged, or on demand. Publishes four channels: the
# playable browser build, and the three desktop builds.
#
# Requires three repository settings:
#   secret   ITCH_API_KEY   from https://itch.io/user/settings/api-keys
#   variable ITCH_USER      your itch.io username
#   variable ITCH_GAME      the project's URL slug
#
# Without the API key the workflow skips rather than fails, so it is harmless
# to merge before the account is wired up.
#
# Triggered by the Release workflow finishing, not by the tag being pushed and
# not by the release being published.
#
# Both of the obvious triggers are wrong, and each was tried:
#
#   `push: tags` fires at the same moment as Release, so this raced ahead and
#   went looking for artifacts that were not built yet. It pushed the browser
#   build, reported "Pushed 0 desktop artifact(s)", and passed — the kind of
#   quiet nothing that looks like success.
#
#   `release: [published]` fixed the race and never fired at all. The release is
#   created by `softprops/action-gh-release` using the default `GITHUB_TOKEN`,
#   and GitHub deliberately does not raise workflow-triggering events for
#   anything a `GITHUB_TOKEN` did — it is the loop guard. So 2.2.0 built, its
#   four artifacts were attached, every check was green, and nothing reached
#   itch.io. Nothing failed either, which is why it took a person going to look
#   at the store page to notice.
#
# `workflow_run` is raised for the workflow completing regardless of which token
# drove it, and it cannot start before Release has finished. The `success`
# check inside the job is what stops it publishing after a failed build, since
# `workflow_run` fires on failure too.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channels:
        description: 'Which channels to push'
        type: choice
        default: all
        options: [all, web-only, desktop-only]

jobs:
  publish:
    name: Push to itch.io
    runs-on: ubuntu-latest
    steps:
      - name: Check the account is wired up
        id: check
        run: |
          # `workflow_run` fires whether Release succeeded or failed. Publishing
          # the artifacts of a failed build is worse than publishing nothing.
          if [ "${{ github.event_name }}" = "workflow_run" ]              && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Release concluded '${{ github.event.workflow_run.conclusion }}' — not publishing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.ITCH_API_KEY }}" ]; then
            echo "No ITCH_API_KEY set — skipping. See RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ vars.ITCH_USER }}" ] || [ -z "${{ vars.ITCH_GAME }}" ]; then
            echo "::error::ITCH_API_KEY is set but ITCH_USER / ITCH_GAME variables are not."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # One place decides what version this is, whether the run came from a
      # published release or from a manual dispatch.
      - name: Resolve the version
        id: version
        if: steps.check.outputs.ready == 'true'
        run: |
          V="${{ github.event.release.tag_name }}"
          [ -z "$V" ] && V=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          [ -z "$V" ] && V="v$(node -p "require('./package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing as $V"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and build
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run bundle:web

      # itch.io serves an HTML game from a zip whose entry point is index.html.
      # The bundle is a single self-contained file, so the zip has exactly one
      # member and there is nothing to break at a relative path.
      - name: Package the browser build
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p itch-web
          cp dist-web/property-flipper.html itch-web/index.html
          echo "Packaged $(du -h itch-web/index.html | cut -f1) browser build"

      - name: Fetch the desktop artifacts from this release
        if: steps.check.outputs.ready == 'true' && github.event.inputs.channels != 'web-only'
        run: |
          mkdir -p desktop
          gh release download "${{ steps.version.outputs.tag }}" --dir desktop
          ls -la desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install butler
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push the browser build
        if: steps.check.outputs.ready == 'true' && github.event.inputs.channels != 'desktop-only'
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          ./butler push itch-web \
            "${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}:html5" \
            --userversion "${{ steps.version.outputs.tag }}"

      - name: Push the desktop builds
        if: steps.check.outputs.ready == 'true' && github.event.inputs.channels != 'web-only'
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          shopt -s nullglob

          # itch queues one build per channel and refuses the next until the
          # previous has finished processing:
          #
          #   itch.io API error (400): /wharf/builds: channel windows's latest
          #   build is still processing, try again later
          #
          # Both Windows artifacts go to the same channel, so the second one
          # hit this every time. It arrives as a non-zero exit, `&&` swallowed
          # it, and the run stayed green while the portable build was quietly
          # never published. Waiting is the whole fix; the queue clears in
          # seconds.
          push() {
            file=$1
            channel=$2
            for attempt in 1 2 3 4 5 6; do
              if ./butler push "$file" "${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}:$channel" --userversion "${{ steps.version.outputs.tag }}"; then
                return 0
              fi
              wait_for=$((attempt * 10))
              echo "  attempt $attempt for $(basename "$file") failed; waiting ${wait_for}s"
              sleep "$wait_for"
            done
            echo "::error::Gave up pushing $(basename "$file") to :$channel after 6 attempts."
            return 1
          }

          expected=0
          pushed=0
          for spec in "windows:desktop/*Setup*.exe" "windows:desktop/*Portable*.exe" "mac:desktop/*.dmg" "linux:desktop/*.AppImage"; do
            channel=${spec%%:*}
            for f in ${spec#*:}; do
              expected=$((expected + 1))
              push "$f" "$channel" && pushed=$((pushed + 1))
            done
          done

          echo "Pushed $pushed of $expected desktop artifact(s)."

          # Every artifact, not merely one of them. This failed only on zero,
          # so a run that published three of four passed with a green tick and
          # left one platform on the previous release -- the exact failure it
          # was written to prevent, one notch along.
          if [ "$expected" -eq 0 ]; then
            echo "::error::No desktop artifacts found — expected .exe, .dmg and .AppImage from the release."
            exit 1
          fi
          if [ "$pushed" -ne "$expected" ]; then
            echo "::error::Only $pushed of $expected desktop artifacts reached itch.io."
            exit 1
          fi

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          {
            echo "### Published to itch.io"
            echo ""
            echo "https://${{ vars.ITCH_USER }}.itch.io/${{ vars.ITCH_GAME }}"
            echo ""
            ./butler status "${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}" || true
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
