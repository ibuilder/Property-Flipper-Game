name: Release

# Tag a version to cut a release:  git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The `secrets` context is not available in a step's `if:` — only in `env`,
    # `with` and `run`. Hoisting the checks to job-level env is what makes the
    # verification steps below actually run; testing the secret directly in the
    # conditional would have evaluated to nothing and skipped them silently,
    # which is the worst possible failure for a step whose entire job is to
    # catch silent failures.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 'release/*.exe'
          - os: macos-latest
            artifact: 'release/*.dmg'
          - os: ubuntu-latest
            artifact: 'release/*.AppImage'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify before shipping
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # Standing in for "verify the build on real hardware": launch the app on
      # this runner's actual OS and assert the renderer mounts. Catches the
      # failures that are invisible until somebody double-clicks the artifact —
      # an icon that will not convert, a file missing from the package, a path
      # that only resolved on the build machine.
      - name: Smoke test the app
        run: npm run smoke

      - name: Package
        run: npm run dist
        env:
          # Windows signing. Set CSC_LINK (base64 of a .pfx) and
          # CSC_KEY_PASSWORD in repository secrets to produce signed builds;
          # without them electron-builder produces an unsigned one.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

          # macOS signing and notarisation. All four are needed together, and
          # CSC_IDENTITY_AUTO_DISCOVERY is turned off when they are absent so
          # an unsigned build succeeds instead of failing to find an identity.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_TEAM_ID != '' }}

      # If signing was configured, prove it actually happened. electron-builder
      # does not fail the build when signtool errors — a timestamp server that
      # cannot be reached produces a loud error, a zero exit code, and a
      # signature that will stop verifying the day the certificate expires.
      # Checking afterwards is the only way that cannot ship silently.
      - name: Verify the Windows signature
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem release\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$($_.Name) is not validly signed"; $failed = $true }
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($_.Name) has no timestamp — the signature dies with the certificate"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Verify the macOS signature and notarisation
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_ID == 'true'
        run: |
          APP=$(find release -name '*.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then echo "::error::no .app found to verify"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The check that matters: Gatekeeper's own verdict, not just that a
          # signature exists.
          spctl --assess --type execute --verbose "$APP"

      - name: Report what was signed
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ] \
              && echo "Windows build is SIGNED and the signature was verified." \
              || echo "Windows build is UNSIGNED — SmartScreen will warn on first launch."
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            [ -n "${{ secrets.APPLE_TEAM_ID }}" ] \
              && echo "macOS build is SIGNED, NOTARISED, and passed Gatekeeper assessment." \
              || echo "macOS build is UNSIGNED — Gatekeeper will block it until the user right-click-opens."
          else
            echo "Linux AppImages are not code-signed by convention."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Every artifact here was launched on its own operating system in CI
            and verified to start before it was published.

            If these builds are unsigned, Windows SmartScreen and macOS
            Gatekeeper will warn on first launch. See RELEASING.md for what
            signing them requires.

            Saves live in your user data directory and survive reinstalling.
